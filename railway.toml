[build]
builder = "NIXPACKS"

[deploy]
# Traffic switches to a new deployment only after MongoDB is connected and
# /health/ready returns 200 (server.ts listens after connecting).
healthcheckPath = "/health/ready"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
# Give the old deployment time to finish in-flight requests after SIGTERM
# (graceful shutdown in server.ts completes within 10s).
drainingSeconds = 15
